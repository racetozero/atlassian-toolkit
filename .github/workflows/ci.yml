name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Keep local agent files out of Git
        run: |
          if git ls-files | grep -E '(^|/)\.agent/|(^|/)(AGENTS|CLAUDE)\.md$'; then
            echo 'Local agent files must not be tracked' >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-nextest
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo nextest run --workspace --profile ci
      - name: Documentation tests
        run: cargo test --workspace --doc
      - name: Release dry runs
        if: runner.os == 'Linux'
        run: |
          cargo build -p atl
          ATL_CONFIG_DIR="$(mktemp -d)" target/debug/atl api jira issues get-issue --issue-id-or-key ABC-1 --dry-run
          ATL_CONFIG_DIR="$(mktemp -d)" ATL_JIRA_URL=https://jira.corp.example ATL_JIRA_TOKEN=x target/debug/atl api jira issue get-issue --issue-id-or-key ABC-1 --dry-run
      - name: Login saves a private config file
        if: runner.os == 'Linux'
        run: |
          dir="$(mktemp -d)"
          printf 'tok' | ATL_CONFIG_DIR="$dir" timeout 60 \
            target/debug/atl auth login --product jira --url https://jira.example.com --token-stdin --no-verify
          test "$(stat -c %a "$dir/config.toml")" = 600

  windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-nextest
      - name: Clippy on Windows
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test on Windows
        run: cargo nextest run --workspace --profile ci
      - name: Documentation tests on Windows
        run: cargo test --workspace --doc

  sdk-wasm:
    name: WebAssembly SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: wasm-pack
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: v2.x
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Check the SDK without native features
        run: cargo clippy -p atlassian-toolkit --no-default-features --target wasm32-unknown-unknown -- -D warnings
      - name: Build and test
        working-directory: crates/atl-wasm
        run: |
          bun install --frozen-lockfile
          bun run build
          bun run test
          bun run test:size

  sdk-python:
    name: Python SDK (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported, the newest stable, and a free-threaded build.
        python: ['3.11', '3.14', '3.14t']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Build and test
        working-directory: crates/atl-py
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          uv sync --locked --python "$PYTHON_VERSION"
          uv run --no-sync pytest -q
          if [[ "$PYTHON_VERSION" == *t ]]; then
            uv run --no-sync python -c 'import sys, atl_sdk._atl; assert not sys._is_gil_enabled()'
          fi

  sdk-node:
    name: Node SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Build and test
        working-directory: crates/atl-node
        run: |
          bun install --frozen-lockfile
          bun run build
          bun run test
          bun run test:bun

  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check shell installer
        if: runner.os != 'Windows'
        run: |
          bash -n install.sh
          sh tests/installer_regression.sh
      - name: Check shell scripts with ShellCheck
        if: runner.os == 'Linux'
        run: shellcheck -x install.sh tests/installer_regression.sh scripts/release.sh scripts/update-specs.sh
      - name: Check PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/installer_regression.ps1

  pgo-scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Test PGO helpers
        run: python scripts/test_pgo.py
