# Outside the root workspace: this package needs a Node-API runtime, which
# must not become a prerequisite for `cargo test --workspace`.
[workspace]

[package]
name = "atl-node"
version = "0.0.2"
edition = "2024"
license = "MIT"
description = "Node-API bindings for atlassian-toolkit (Node.js, Bun, Deno)"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
atl-sdk = { package = "atlassian-toolkit", path = "../atl-sdk" }
napi = { version = "3", features = ["napi9", "tokio_rt"] }
napi-derive = "3"
serde_json = { version = "1", features = ["preserve_order"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = "thin"
codegen-units = 1
